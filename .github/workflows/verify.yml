name: verify-and-docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out AtCoder Library
        uses: actions/checkout@v7
        with:
          repository: atcoder/ac-library
          ref: v1.6
          path: .third_party/ac-library
          persist-credentials: false

      - name: Configure AtCoder Library headers
        run: |
          echo "ACL_INCLUDE_PATH=$GITHUB_WORKSPACE/.third_party/ac-library" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=$GITHUB_WORKSPACE/.third_party/ac-library" >> "$GITHUB_ENV"

      - name: Set up competitive-verifier
        uses: competitive-verifier/actions/setup@v2
        with:
          package: competitive-verifier==4.2.2
          python-version: "3.13"
          cache-pip: true

      - name: Check maintained snippet synchronization
        run: |
          python3 tools/test_pages_workflow.py
          python3 tools/check_interval_set_snippet_sync.py
          python3 tools/test_interval_set_snippet_sync.py
          python3 tools/check_rbst_snippet_sync.py
          python3 tools/check_euler_tour_snippet_sync.py
          python3 tools/check_unresolved_snippet_sync.py

      - name: Resolve verification files
        id: resolve
        uses: competitive-verifier/actions/oj-resolve@v2
        with:
          include: |
            library
            verify
          config: .competitive-verifier/config.toml
          output-path: ${{ runner.temp }}/verify-files.json

      - name: Verify
        uses: competitive-verifier/actions/verify@v2
        with:
          verify-files: ${{ steps.resolve.outputs.json-path }}
          destination: ${{ runner.temp }}/verify-result.json
          write-summary: true
          check: true

      - name: Generate documentation
        uses: competitive-verifier/actions/docs@v2
        with:
          verify-files: ${{ steps.resolve.outputs.json-path }}
          verify-result: ${{ runner.temp }}/verify-result.json
          include: |
            library
            verify
          docs: .competitive-verifier/docs
          destination: _jekyll
          write-summary: true

      - name: Copy license and attribution notices
        run: cp LICENSE LICENSE-SCOPE.md NOTICE THIRD_PARTY_NOTICES.md _jekyll/

      - name: Set project-site base path
        run: |
          printf '\nbaseurl: /%s\n' "${GITHUB_REPOSITORY#*/}" >> _jekyll/_config.yml

      - name: Build documentation site
        uses: actions/jekyll-build-pages@v1
        with:
          source: _jekyll
          destination: _site

      - name: Check generated links and assets
        run: python3 tools/check_generated_html.py _site "/${GITHUB_REPOSITORY#*/}"

      - name: Upload documentation preview
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: competitive-verifier-docs-${{ github.sha }}
          path: _site
          if-no-files-found: error
          retention-days: 7

      - name: Prepare GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy verified documentation
        id: deployment
        uses: actions/deploy-pages@v5
