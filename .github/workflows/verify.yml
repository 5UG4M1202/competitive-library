name: verify-and-docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up competitive-verifier
        uses: competitive-verifier/actions/setup@v2
        with:
          package: competitive-verifier==4.2.2
          python-version: "3.13"
          cache-pip: true

      - name: Resolve verification files
        id: resolve
        uses: competitive-verifier/actions/oj-resolve@v2
        with:
          include: |
            library
            verify
          config: .competitive-verifier/config.toml
          output-path: ${{ runner.temp }}/verify-files.json

      - name: Verify
        uses: competitive-verifier/actions/verify@v2
        with:
          verify-files: ${{ steps.resolve.outputs.json-path }}
          destination: ${{ runner.temp }}/verify-result.json
          write-summary: true
          check: true

      - name: Generate documentation
        uses: competitive-verifier/actions/docs@v2
        with:
          verify-files: ${{ steps.resolve.outputs.json-path }}
          verify-result: ${{ runner.temp }}/verify-result.json
          include: |
            library
            verify
          docs: .competitive-verifier/docs
          destination: _jekyll
          write-summary: true

      - name: Build documentation site
        uses: actions/jekyll-build-pages@v1
        with:
          source: _jekyll
          destination: _site

      - name: Upload documentation preview
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: competitive-verifier-docs-${{ github.sha }}
          path: _site
          if-no-files-found: error
          retention-days: 7

      - name: Prepare GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
