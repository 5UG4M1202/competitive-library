<style>
  /* Keep long paths within narrow screens; code blocks scroll independently. */
  h1, h2, h3, li, p { overflow-wrap: anywhere; }
  :not(pre) > code { white-space: normal; overflow-wrap: anywhere; }
  pre { box-sizing: border-box; max-width: 100%; overflow-x: auto; }
  pre code { overflow-wrap: normal; }
</style>
